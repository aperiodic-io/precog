[package]
name = "storage-bench"
description = "Durable group-commit append benchmark across Rust storage options"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
crossbeam-channel = "0.5.17"
fjall = "3.1.13"
hdrhistogram = "7.6.0"
heed = "0.23.1"
io-uring = "0.7.16"
libc = "0.2.191"
protobuf = "2"
raft = { version = "0.7.0", default-features = false, features = ["protobuf-codec"] }
raft-engine = "0.4.2"
rand = "0.10.4"
redb = "4.6.0"
rocksdb = { version = "0.25.0", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

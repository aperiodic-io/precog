[package]
name = "precog-mesh"
description = "Leaderless writer-log broker mesh POC (Iggy-inspired, TCP transport)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
futures = "0.3"
parking_lot = "0.12"
redb = "4.6.0"
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
precog-storage = { path = "../storage" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gungraun = "0.19.4"
proptest = "1"
cucumber = "0.23"
tempfile = "3"
# (the SDK depends on this crate: a dev-dependency back, for the acceptance scenarios it drives)
precog-client = { path = "../client" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Feature files under tests/acceptance/features driven against real precog-node processes.
# Not a default test target (minutes, and its runner has no `--list` for nextest):
# run it with `cargo test -p precog-mesh --test acceptance`.
[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
harness = false
test = false

# Instruction-count gate (CI fails a PR that adds more than 2% instructions)
[[bench]]
name = "gate"
harness = false

[package]
name = "precog-bench"
description = "Same-harness benchmark: Apache Iggy (official SDK) vs precog mesh"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hdrhistogram = "7"
iggy = "=0.12.0"
precog-mesh = { path = "../mesh" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

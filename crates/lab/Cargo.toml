[package]
name = "precog-lab"
version = "0.1.0"
edition = "2024"
publish = false
description = "Proofs of concept compared before a design is settled (evidence; not part of the product)"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = "0.15"
bytes = "1"
crc32c = "0.6"
libc = "0.2"
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
# Round 3 (transport and I/O): each is one POC's I/O layer.
io-uring = "0.7"
monoio = { version = "0.2", default-features = false, features = ["iouring", "async-cancel", "bytes"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
zstd = { version = "0.13", features = ["zdict_builder"] }

[dev-dependencies]
precog-mesh = { path = "../mesh" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

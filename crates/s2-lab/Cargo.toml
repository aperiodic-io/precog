# Evidence for docs/S2-PLAN.md, never product code: an S2-REST gateway over Precog, a load
# driver that speaks S2's REST API to s2-lite and to the gateway alike, and a million-stream
# probe. Outside the workspace (its own lockfile) so CI never builds its HTTP and S3 stacks.
[package]
name = "precog-s2-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
precog-mesh = { path = "../mesh" }
precog-client = { path = "../client" }
precog-lab = { path = "../lab" }
anyhow = "1"
axum = "0.8"
bytes = "1"
futures = "0.3"
object_store = { version = "0.12", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
debug = 1

\* expect: Exact
\* spec: Dormant
\* A stream marked clean when its summary is written instead of when it is collected: a change
\* between the two leaves it clean, so it leaves RAM without it.
CONSTANTS
    Streams = {s1, s2}
    MaxLen = 3
    MaxCrashes = 0
    ClearAtCollect = FALSE
    SkipForgotten = TRUE
    EvictInFlightGuard = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Exact

\* expect: Exact
\* spec: Dormant
\* Eviction while a checkpoint is in flight (found by this model): its streams count as clean
\* once collected, so one leaves RAM before its summary is on disk and wakes from the older one.
CONSTANTS
    Streams = {s1}
    MaxLen = 2
    MaxCrashes = 0
    ClearAtCollect = TRUE
    SkipForgotten = TRUE
    EvictInFlightGuard = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK Exact

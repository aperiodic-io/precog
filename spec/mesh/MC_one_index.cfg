\* spec: MCReplication
\* Both producer replicas send to one node (the stream's preferred one): one copy per key.
CONSTANTS
    Nodes <- Three
    Dom <- ThreeDomains
    Entry <- First
    Ids <- Replicas
    KeysOf <- SameKey
    Copies = 2
    Variants = {"v"}
    WriteCaching = FALSE
    Dedup = TRUE
    MaxSends = 2
    MaxFaults = 0
    MaxCrashes = 0
    EndNeed = 2
SPECIFICATION Spec
INVARIANTS OneCopyPerKey DedupLosesNothing

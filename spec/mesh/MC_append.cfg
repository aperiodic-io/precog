\* spec: MCReplication
\* Three nodes in three domains, copies 2, two producer replicas sending the same key; power losses and a lost disk.
CONSTANTS
    Nodes <- Three
    Dom <- ThreeDomains
    Entry <- Three
    Ids <- Replicas
    KeysOf <- SameKey
    Copies = 2
    Variants = {"v"}
    WriteCaching = FALSE
    Dedup = TRUE
    MaxSends = 1
    MaxFaults = 1
    MaxCrashes = 1
    EndNeed = 2
SPECIFICATION Spec
INVARIANTS AckedSurvive AckedInCopiesDomains NoConflictingAcks EndCoversAcked

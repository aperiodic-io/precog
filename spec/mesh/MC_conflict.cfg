\* spec: MCReplication
\* A writer reuses an identity with other content: never acknowledged twice.
CONSTANTS
    Nodes <- Three
    Dom <- ThreeDomains
    Entry <- Three
    Ids <- One
    KeysOf <- NoKey
    Copies = 2
    Variants = {"v", "x"}
    WriteCaching = FALSE
    Dedup = FALSE
    MaxSends = 1
    MaxFaults = 1
    MaxCrashes = 1
    EndNeed = 2
    RepairRecords = TRUE
SPECIFICATION Spec
INVARIANTS AckedSurvive NoConflictingAcks

\* expect: AckedIsDeleted
\* spec: Delete
\* A floor above what the accepting node holds only: a batch acknowledged on the two other nodes is not deleted.
CONSTANTS
    Nodes = {a, b, c}
    MaxEpoch = 2
    Copies = 2
    EndNeed = 2
    MaxDeletes = 2
    MaxLost = 0
    Refuse = TRUE
    Recheck = TRUE
    Reapply = TRUE
    Quorum = FALSE
    Resettle = TRUE
SPECIFICATION Spec
INVARIANTS AckedIsDeleted

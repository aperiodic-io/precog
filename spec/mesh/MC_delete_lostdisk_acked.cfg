\* expect: AckedIsDeleted
\* spec: Delete
\* A known limit, as Client::end has: after a disk loss, EndNeed nodes may not hold an acknowledged batch, and the floor can fall below it until repair.
CONSTANTS
    Nodes = {a, b, c}
    MaxEpoch = 2
    Copies = 2
    EndNeed = 2
    MaxDeletes = 2
    MaxLost = 1
    Refuse = TRUE
    Recheck = TRUE
    Reapply = TRUE
    Quorum = TRUE
SPECIFICATION Spec
INVARIANTS AckedIsDeleted

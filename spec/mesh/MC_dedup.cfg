\* spec: MCReplication
\* Dedup with power losses but no lost disk and no write caching: no event is lost.
CONSTANTS
    Nodes <- Three
    Dom <- ThreeDomains
    Entry <- Three
    Ids <- Replicas
    KeysOf <- SameKey
    Copies = 2
    Variants = {"v"}
    WriteCaching = FALSE
    Dedup = TRUE
    MaxSends = 1
    MaxFaults = 0
    MaxCrashes = 2
    EndNeed = 2
SPECIFICATION Spec
INVARIANTS AckedSurvive DedupLosesNothing

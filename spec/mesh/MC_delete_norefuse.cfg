\* expect: DeletedStaysDeleted
\* spec: Delete
\* A node that only forgets what it holds when the floor arrives, and neither refuses nor
\* drops what it is handed later: a peer that was down during the delete hands the batch back.
CONSTANTS
    Nodes = {a, b, c}
    MaxEpoch = 2
    Copies = 2
    EndNeed = 2
    MaxDeletes = 2
    MaxLost = 0
    Refuse = FALSE
    Recheck = FALSE
    Reapply = TRUE
    Quorum = TRUE
SPECIFICATION Spec
INVARIANTS DeletedStaysDeleted

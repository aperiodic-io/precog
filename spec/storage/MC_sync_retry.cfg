\* expect: AckedSurvive
\* spec: SegmentLog
\* A log that retries a failed fsync instead of refusing writes: the retry succeeds without the
\* pages the failure dropped, and acknowledges them. Error::Fatal on an fsync error closes this.
CONSTANTS
    N = 4
    MaxGroup = 2
    WriteCaching = FALSE
    FlushSlots = 1
    Bound = 3
    Fixed = TRUE
    MediaFaults = FALSE
    MaxCrashes = 1
    SyncFaults = TRUE
    FsyncFatal = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK Prefix AckedSurvive NoFalseAlarm FailClosed

# cargo-mutants: every mutant in changed production code must be caught by a unit, property or
# integration test. The acceptance suite (real processes, minutes) is not run per mutant.
test_tool = "nextest"
additional_cargo_test_args = ["-E", "not binary(acceptance)"]
# benchmarks, examples and the comparison crates are not production logic
exclude_globs = ["crates/*/benches/**", "crates/*/examples/**", "crates/storage-bench/**", "crates/bench/**"]
# Equivalent or not observable in-process; each listed with why:
exclude_re = [
    # directory fsync: only a power cut between rename and fsync tells it apart
    "replace sync_dir -> std::io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    # stops the preallocator thread; the process exiting does the same, and a leak is invisible
    "replace <impl Drop for Log>::drop with \\(\\)",
    # the manifest body grows in 49-byte steps: body + 24 never equals the 64 KiB slot exactly
    "replace > with >= in Manifest::encode",
    # read-ahead buffering only: a wrong window re-reads or over-reads, which the recovery
    # tests catch as wrong results and the `recover` instruction bench catches as slowdowns
    "in Window<'_>::cover",
    # closes a race with concurrent retention; not reachable deterministically from a test
    "replace match guard self.trimmed\\(lsn\\) with false in Reader::read",
]

name: nightly
# What is too slow for every PR: the whole acceptance suite (@stress included), every mutant of
# both crates, and the comparison with Apache Iggy.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p precog-mesh --test acceptance

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { shared-key: mutants, cache-on-failure: true }
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with: { tool: "cargo-mutants,cargo-nextest" }
      - env: { CARGO_INCREMENTAL: "1" }
        run: |
          c=0
          cargo mutants -p precog-storage -p precog-mesh --no-shuffle --shard ${{ matrix.shard }}/4 || c=$?
          if [ "$c" -eq 3 ] && [ -s mutants.out/timeout.txt ] && ! [ -s mutants.out/missed.txt ]; then c=0; fi
          exit "$c"
      - if: failure()
        run: cat mutants.out/missed.txt 2>/dev/null || true

  # Same-harness comparison with the current Apache Iggy image: single node and 3-node VSR,
  # durable acks. Informational (shared runner, one disk): it uploads the numbers.
  iggy-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p precog-mesh -p precog-bench
      - run: |
          mkdir -p run/bin
          id=$(docker create apache/iggy:latest)
          docker cp "$id:/usr/local/bin/iggy-server" run/bin/
          docker rm "$id"
      - run: REPS=1 DUR=8 OUT=results/nightly.jsonl scripts/bench_suite.sh single cluster
      - run: python3 scripts/summarize.py results/nightly.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: iggy-comparison, path: "results/nightly.jsonl" }
